name: pages
# Publishes viewer/ as a static site: https://<owner>.github.io/<repo>/
# One-time setup in the repository: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["viewer/**", "distortkit/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test the viewer
        run: node --test viewer/tests/viewer.test.mjs
      - name: Collect the files the site needs
        run: |
          mkdir _site
          cp -r viewer/index.html viewer/css viewer/js viewer/vendor viewer/examples _site/
          touch _site/.nojekyll
      - name: Pack DistortKit for the in-browser symmetry analysis
        run: python3 viewer/tools/build_py_bundle.py _site/py/distortkit.zip
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
