name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install .
      - name: Run the tests
        run: |
          set -o pipefail
          python -m unittest discover -s tests 2>&1 | tee test.log
      - name: Report failing tests
        if: failure()
        run: python tools/ci_annotate.py test.log

  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run the viewer tests
        run: node --test viewer/tests/viewer.test.mjs
